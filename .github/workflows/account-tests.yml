name: Account dashboard checks
on:
  pull_request:
    branches: [main]
    paths: ['account/**', 'assets/fonts/**', 'assets/starlit-mark.svg', '.github/workflows/account-tests.yml']
  push:
    branches: [main]
    paths: ['account/**', 'assets/fonts/**', 'assets/starlit-mark.svg', '.github/workflows/account-tests.yml']
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
