# One website container: marketing at / and the logged-in dashboard at /account/.
# Reuse the existing VPS Caddy HTTPS edge; publish no extra host ports.
services:
  website:
    image: caddy:2.10.2
    container_name: starlit-site-web
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.50
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=0700
    volumes:
      - ./releases:/srv/releases:ro
      - ./release-feed:/srv/release-feed:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "8081"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

  # Keeps /releases.json current from the app's public GitHub releases, so
  # the changelog and version numbers update between website deployments.
  # Outbound HTTPS to api.github.com only; no ports, no secrets, no edge
  # network. A failed request keeps the last good file.
  release-feed:
    image: node:22.23.4-alpine3.24
    container_name: starlit-release-feed
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.25
    working_dir: /app
    command: ["node", "sync-releases.mjs", "--out", "/feed/releases.json", "--watch", "900"]
    volumes:
      - ./release-feed-tool:/app:ro
      - ./release-feed:/feed
    networks:
      - egress

networks:
  edge:
    external: true
    name: rrm-ntfy_tokview-push
  egress: {}
