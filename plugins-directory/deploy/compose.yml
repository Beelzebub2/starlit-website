# Deploy on the same private Docker edge network as the main Starlit website.
# Exposes no host ports. The existing Cloudflare Tunnel edge is the only ingress.
services:
  plugins:
    image: caddy:2.11.8
    container_name: starlit-plugins-web
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 40
    mem_limit: 128m
    cpus: 0.35
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=0700
    volumes:
      - ./releases:/srv/releases:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "8082"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

networks:
  edge:
    external: true
    name: rrm-ntfy_tokview-push
